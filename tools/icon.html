<!DOCTYPE html>
<!-- The TV app icon (512x423, Samsung's app-list size). Rendered to icon.png by:
     node tools/drive.mjs --size 512x423 --url file:///<path>/tools/icon.html --out . shot:icon
     With ?square: the PC app's square icon (no name, which is unreadable that small):
     node tools/drive.mjs --size 512x512 --url file:///<path>/tools/icon.html?square --out . shot:pwa-512 shot:pwa-192@0,0,512,512,0.375 -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Inter"; src: url("../fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 512px; height: 423px; overflow: hidden; }
  body {
    background:
      radial-gradient(60% 55% at 50% 40%, rgba(255, 150, 70, .22) 0%, rgba(255, 110, 40, .06) 45%, transparent 70%),
      radial-gradient(120% 100% at 50% 0%, #15121a 0%, #08080b 60%, #040405 100%);
    font-family: "Inter", sans-serif;
  }
  svg { position: absolute; left: 56px; top: 34px; width: 400px; height: 280px; }
  .sq, .sq body { height: 512px; }
  .sq svg { top: 116px; }
  .sq .name { display: none; }
  .name {
    position: absolute; left: 0; right: 0; top: 318px; text-align: center;
    font-size: 36px; font-weight: 250; letter-spacing: .48em; margin-right: -.48em; text-transform: uppercase;
    background: linear-gradient(90deg, #ffffff 10%, #fff0d8 55%, #ffbf80 95%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
</style>
</head>
<body>
<script>if (/square/.test(location.search)) document.documentElement.className = 'sq';</script>
<svg viewBox="0 0 400 280">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a2f" stop-opacity=".15"/>
      <stop offset=".3" stop-color="#ffb46a" stop-opacity=".85"/>
      <stop offset=".5" stop-color="#fff6e8"/>
      <stop offset=".72" stop-color="#ffc98f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset=".45" stop-color="#ffe2b8" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#ffb46a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a2f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <g transform="rotate(-14 200 140)">
    <!-- far side of the disk, behind the hole -->
    <path d="M18 140 A182 46 0 0 1 382 140" fill="none" stroke="url(#ring)" stroke-width="16" filter="url(#softer)" opacity=".7"/>
    <path d="M18 140 A182 46 0 0 1 382 140" fill="none" stroke="url(#ring)" stroke-width="5"/>
  </g>
  <!-- lensed light bending over the top of the hole -->
  <path d="M128 140 A72 72 0 0 1 272 140" fill="none" stroke="#ffd9a8" stroke-width="7" filter="url(#soft)" opacity=".85"/>
  <circle cx="200" cy="140" r="100" fill="url(#halo)"/>
  <circle cx="200" cy="140" r="60" fill="#000"/>
  <circle cx="200" cy="140" r="61" fill="none" stroke="#fff1dc" stroke-width="2.5"/>
  <g transform="rotate(-14 200 140)">
    <!-- near side of the disk, crossing in front of the hole -->
    <path d="M382 140 A182 46 0 0 1 18 140" fill="none" stroke="url(#ring)" stroke-width="18" filter="url(#softer)" opacity=".75"/>
    <path d="M382 140 A182 46 0 0 1 18 140" fill="none" stroke="url(#ring)" stroke-width="6"/>
  </g>
</svg>
<div class="name">Gravitos</div>
</body>
</html>
